<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>gud store - publique seus apps</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
:root{--g1:#00e676;--g2:#00b0ff;--bg:#0d1621;--card:#16222f;--card2:#1c2b3d;--tx:#f2f7ff;--tx2:#9fb3c8;--gold:#ffca28;--red:#ff5252}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;background:linear-gradient(160deg,#0d1621,#0a1f1c 60%,#0d1621);color:var(--tx);min-height:100vh}
h1,h2,h3,.baloo{font-family:'Baloo 2',cursive;margin:0}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:90px}
.screen{padding:16px;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.logo{display:flex;align-items:center;gap:10px}
.logo .mark{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--g1),var(--g2));display:flex;align-items:center;justify-content:center;font-family:'Baloo 2';font-weight:800;font-size:24px;color:#06281c;box-shadow:0 4px 18px rgba(0,230,118,.4)}
.gcard{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:none;border-radius:16px;font-family:'Baloo 2';font-weight:700;font-size:17px;cursor:pointer;background:linear-gradient(135deg,var(--g1),#00c853);color:#052a18;margin:8px 0;box-shadow:0 4px 14px rgba(0,230,118,.35);transition:transform .08s}
.gbtn:active{transform:scale(.96)}
.gbtn.blue{background:linear-gradient(135deg,var(--g2),#2979ff);color:#fff;box-shadow:0 4px 14px rgba(0,176,255,.35)}
.gbtn.ghost{background:var(--card2);color:var(--tx);box-shadow:none;border:1px solid rgba(255,255,255,.1)}
.gbtn.red{background:linear-gradient(135deg,#ff5252,#d32f2f);color:#fff;box-shadow:0 4px 14px rgba(255,82,82,.35)}
.gbtn:disabled{opacity:.5}
.ginput{width:100%;padding:13px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:#0e1826;color:var(--tx);font-size:15px;margin:6px 0;font-family:'Nunito'}
.ginput:focus{outline:2px solid var(--g1)}
textarea.ginput{min-height:90px;resize:vertical}
label.lbl{font-size:13px;color:var(--tx2);font-weight:700}
.hero{background:linear-gradient(135deg,#00c853,#00b0ff);border-radius:22px;padding:22px 18px;margin:12px 0;color:#04241a;position:relative;overflow:hidden}
.hero h2{font-size:26px}
.hero p{margin:6px 0 0;font-weight:600}
.appcard{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:12px;margin:10px 0;border:1px solid rgba(255,255,255,.06)}
.appcard img.appicon{width:58px;height:58px;border-radius:14px;object-fit:cover;background:var(--card2)}
.appcard .inf{flex:1;min-width:0}
.appcard .inf b{font-size:16px}
.appcard .inf small{color:var(--tx2)}
.verif{background:#0e1826;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px;display:flex;align-items:center;gap:10px}
.verif .st{margin-left:auto;font-weight:800}
.ok{color:var(--g1)} .no{color:var(--red)} .wait{color:var(--gold)}
.spin{width:18px;height:18px;border:3px solid rgba(255,255,255,.2);border-top-color:var(--g1);border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:-4px}
@keyframes sp{to{transform:rotate(360deg)}}
.pbar{height:16px;background:#0e1826;border-radius:99px;overflow:hidden;margin:12px 0}
.pbar>div{height:100%;width:0;background:linear-gradient(90deg,var(--g1),var(--g2));border-radius:99px;transition:width .2s}
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(13,22,33,.96);backdrop-filter:blur(8px);display:flex;border-top:1px solid rgba(255,255,255,.08);padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:50}
.tab{flex:1;background:none;border:none;color:var(--tx2);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;cursor:pointer;font-family:'Nunito'}
.tab .material-icons{font-size:24px}
.tab.on{color:var(--g1)}
.tab.pub .material-icons{font-size:32px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#052a18;border-radius:50%;width:52px;height:52px;display:flex;align-items:center;justify-content:center;margin-top:-18px;box-shadow:0 4px 14px rgba(0,230,118,.5)}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 16px 4px}
.topbar .back{background:var(--card2);border:none;color:var(--tx);border-radius:12px;width:40px;height:40px;cursor:pointer}
.popup{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.popup .box{background:var(--card);border-radius:22px;padding:24px;max-width:380px;width:100%;text-align:center;border:1px solid rgba(0,230,118,.3);animation:pop .25s}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.steps{display:flex;gap:6px;margin:10px 0}
.steps div{flex:1;height:6px;border-radius:99px;background:#0e1826}
.steps div.on{background:var(--g1)}
.photorow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.photorow img{width:72px;height:72px;object-fit:cover;border-radius:12px}
.shapes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}
.shape{aspect-ratio:1;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid transparent}
.shape.on{border-color:var(--g1)}
.colors{display:flex;gap:10px;margin:10px 0}
.color{width:40px;height:40px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.color.on{border-color:#fff}
.phone{width:250px;height:440px;background:#0a0f16;border:3px solid #2a3b4f;border-radius:26px;margin:10px auto;position:relative;overflow:hidden}
.el{position:absolute;cursor:pointer;border:2px solid transparent;word-break:break-word}
.el.sel{border-color:var(--g1);border-style:dashed}
.toolgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.tool{background:var(--card2);border:1px solid rgba(255,255,255,.08);color:var(--tx);border-radius:14px;padding:10px 4px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Nunito'}
.tool .material-icons{display:block;font-size:22px;color:var(--g1);margin-bottom:2px}
.moverow{display:flex;gap:6px;justify-content:center;margin:8px 0}
.move{background:var(--card2);border:none;color:var(--tx);border-radius:10px;width:44px;height:40px;font-size:18px;cursor:pointer}
.badge{display:inline-block;background:linear-gradient(135deg,var(--gold),#ff9800);color:#3a2500;font-size:11px;font-weight:800;border-radius:99px;padding:3px 10px;margin-left:6px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px}
.kv b{color:var(--tx)} .kv span{color:var(--tx2)}
.center{text-align:center} .muted{color:var(--tx2);font-size:13px}
.big{font-size:52px}
.toplink{color:var(--g1);font-weight:700;cursor:pointer}
.tree{font-family:monospace;font-size:13px;background:#0e1826;border-radius:12px;padding:12px}
.chattop{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;background:#16222f;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.chatavatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g2));display:flex;align-items:center;justify-content:center;font-family:'Baloo 2';font-weight:800;font-size:20px;color:#052a18;flex-shrink:0}
.chatmsgs{padding:14px 12px 150px;min-height:60vh}
.bubble{max-width:82%;padding:10px 13px;border-radius:16px;margin:6px 0;font-size:14px;line-height:1.45;animation:fade .2s;word-break:break-word}
.bubble.eu{margin-left:auto;background:linear-gradient(135deg,#00c853,#009624);color:#fff;border-bottom-right-radius:4px}
.bubble.bot{background:#1c2b3d;border-bottom-left-radius:4px}
.bubble img{max-width:100%;border-radius:10px;display:block}
.chatstatus{font-size:11px;color:var(--tx2);text-align:right;margin:0 6px 8px}
.chatact{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(13,22,33,.97);border-top:1px solid rgba(255,255,255,.08);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:60}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="fiFoto" accept="image/*" multiple style="display:none">
<input type="file" id="fiIcon" accept="image/*" style="display:none">
<input type="file" id="fiApp" accept=".apk,.html,.htm" style="display:none">
<input type="file" id="fiElImg" accept="image/*" style="display:none">
<input type="file" id="fiElVid" accept="video/*" style="display:none">
<input type="file" id="fiUpd" accept=".apk,.html,.htm" style="display:none" onchange="updArquivo(this)">
<input type="file" id="fiIconUpd" accept="image/*" style="display:none" onchange="updIcone(this)">
<input type="file" id="fiFotoUpd" accept="image/*" multiple style="display:none" onchange="updFotos(this)">
<input type="file" id="fiChatIcon" accept="image/*" style="display:none" onchange="chatIcon(this)">
<input type="file" id="fiChatFotos" accept="image/*" multiple style="display:none" onchange="chatFotos(this)">
<input type="file" id="fiPasta" webkitdirectory multiple style="display:none" onchange="lerPasta(this)">
<script>
// ================= CONFIG =================
var EMAIL_DONO = ""; // <<<<< COLOQUE SEU E-MAIL AQUI (o dono vira "gud studios")
var KEY_U='gud_users', KEY_S='gud_session', KEY_A='gud_apps', KEY_D='gud_dl', KEY_O='gud_owner';
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
// ============ SOM DE CLIQUE SATISFATÓRIO ============
var AC=null;
function gudClick(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(520,AC.currentTime);o.frequency.exponentialRampToValueAtTime(880,AC.currentTime+.07);g.gain.setValueAtTime(.18,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.12);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.13);}catch(e){}}
document.addEventListener('click',function(e){if(e.target.closest('button,.tab,.shape,.color,.tool,.appcard'))gudClick();});
// ============ CONTA ============
function users(){return load(KEY_U,[]);} function saveUsers(u){save(KEY_U,u);}
function sess(){return localStorage.getItem(KEY_S);} function setSess(e){if(e)localStorage.setItem(KEY_S,e);else localStorage.removeItem(KEY_S);}
function me(){var e=sess();if(!e)return null;return users().find(function(u){return u.email===e;})||null;}
function isDono(u){if(!u)return false;var o=load(KEY_O,null);if(EMAIL_DONO&&u.email===EMAIL_DONO)return true;return o&&u.email===o;}
function apps(){return load(KEY_A,[]);} function saveApps(a){return save(KEY_A,a);}
// ============ APPS DO SITE (estrutura do usuário) ============
// Repo:
//   Fotos/icon.jpg, Fotos/Foto 1.jpg, Fotos/Foto 2.jpg, Fotos/Foto 3.jpg
//   app/app.apk              <- v0.1 (renomeie seu apk para app.apk)
//   Atualizações/v2.apk, v3.apk...  <- updates (a loja pega o mais recente)
var NOME_DO_APP='Stylus Get Right'; // <-- nome do app (mude aqui se quiser)
var SITE_APPS=[];
function todosApps(){return SITE_APPS.concat(apps());}
function arquivoExiste(url){
  return fetch(url,{method:'HEAD',cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return true;}).catch(function(){return false;});
}
function enc(u){return encodeURI(u);}
var PASTAS_ATUALIZ=['Atualizações','Atualizacoes'];
function probeUpdates(ups,v){
  if(v>9)return Promise.resolve();
  var urls=PASTAS_ATUALIZ.map(function(an){return an+'/v'+v+'.apk';});
  var t=Promise.resolve(null);
  urls.forEach(function(u){t=t.then(function(a){return a||arquivoExiste(u).then(function(ok){return ok?u:null;});});});
  return t.then(function(u){
    if(!u)return;
    ups.push({versao:'0.'+v,arquivo:enc(u)});
    return probeUpdates(ups,v+1);
  });
}
function primeiroQueExiste(urls){
  var t=Promise.resolve(null);
  urls.forEach(function(u){
    t=t.then(function(found){
      if(found)return found;
      return arquivoExiste(u).then(function(ok){return ok?u:null;});
    });
  });
  return t;
}
// A loja aceita o APK com qualquer um desses nomes (não precisa renomear!)
var APK_CANDIDATOS=[
  'app/app.apk',
  'app/stylus get right_1.apk'
];
function carregarAppsSite(){
  SITE_APPS=[];
  return primeiroQueExiste(APK_CANDIDATOS).then(function(apkPath){
    if(!apkPath)return;
    var ups=[{versao:'0.1',arquivo:enc(apkPath)}];
    return probeUpdates(ups,2).then(function(){
      var LS=ups[ups.length-1];
      SITE_APPS.push({id:'site-app',site:true,nome:NOME_DO_APP,
        descricao:'Baixe o '+NOME_DO_APP+' na gud store! 💚',
        empresa:'',dono:'',
        icon:enc('Fotos/icon.jpg'),
        fotos:[enc('Fotos/Foto 1.jpg'),enc('Fotos/Foto 2.jpg'),enc('Fotos/Foto 3.jpg')],
        updates:ups,versao:LS.versao,quando:Date.now()});
      try{if(typeof TAB!=='undefined'&&TAB==='inicio')telaInicio();}catch(e){}
    });
  }).catch(function(){});
}
function fazerDownloadApp(L,a){
  if(L.arquivo){var l=document.createElement('a');l.href=L.arquivo;l.download=(a.nome||'app').replace(/\s+/g,'-')+'.apk';document.body.appendChild(l);l.click();setTimeout(function(){l.remove();},400);}
  else baixarArquivo(L,a.nome);
}
function dls(){return load(KEY_D,{});} function saveDls(d){save(KEY_D,d);}
function uid(){return 'id'+Date.now().toString(36)+Math.floor(Math.random()*999);}
// ============ SEED ============
// loja comeca vazia: voce publica o primeiro app!
(function(){try{var _a=apps(),_b=_a.filter(function(x){return x.id!=='seed1';});if(_b.length!==_a.length)saveApps(_b);}catch(e){}})();
// ============ TELAS ============
var app=$('app');
function telaLogin(modo){
  modo=modo||'entrar';
  app.innerHTML='<div class="screen"><div class="center" style="padding:26px 0 6px"><div class="logo" style="justify-content:center"><div class="mark" style="width:64px;height:64px;font-size:34px">g</div></div><h1 style="font-size:34px;margin-top:8px">gud store</h1><p class="muted">publique seus apps. boa e confiável! 💚</p></div>'
  +'<div class="gcard"><h2>'+(modo==='entrar'?'Entrar':'Criar conta')+'</h2>'
  +(modo==='criar'?'<label class="lbl">Seu nome</label><input class="ginput" id="fNome" placeholder="Como quer ser chamado?">':'')
  +'<label class="lbl">E-mail</label><input class="ginput" id="fEmail" type="email" placeholder="voce@email.com">'
  +'<label class="lbl">Senha</label><input class="ginput" id="fSenha" type="password" placeholder="••••••">'
  +(modo==='criar'?'<label class="lbl">Confirmar senha</label><input class="ginput" id="fSenha2" type="password" placeholder="••••••">':'')
  +'<button class="gbtn" onclick="doAuth(\''+modo+'\')"><span class="material-icons">'+(modo==='entrar'?'login':'person_add')+'</span> '+(modo==='entrar'?'Entrar':'Criar conta')+'</button>'
  +'<p class="center muted">'+(modo==='entrar'?'Não tem conta? <span class="toplink" onclick="telaLogin(\'criar\')">Criar conta</span>':'Já tem conta? <span class="toplink" onclick="telaLogin(\'entrar\')">Entrar</span>')+'</p>'
  +'<p class="center muted" style="font-size:11px">🔒 sua conta fica salva de verdade neste aparelho</p></div></div>';
}
window.telaLogin=telaLogin;
window.doAuth=function(modo){
  var email=($('fEmail').value||'').trim().toLowerCase(), senha=$('fSenha').value||'';
  if(!email||email.indexOf('@')<0){alert('Digite um e-mail válido!');return;}
  if(senha.length<4){alert('A senha precisa de 4+ caracteres!');return;}
  var us=users();
  if(modo==='criar'){
    var nome=($('fNome').value||'').trim()||'Jogador';
    if($('fSenha2').value!==senha){alert('As senhas não conferem!');return;}
    if(us.find(function(u){return u.email===email;})){alert('Esse e-mail já tem conta! Tente entrar.');return;}
    var dono=false;
    if(EMAIL_DONO&&email===EMAIL_DONO)dono=true;
    else if(!load(KEY_O,null)){save(KEY_O,email);dono=true;}
    us.push({nome:nome,email:email,senha:btoa(senha),dono:dono,quando:Date.now()});
    saveUsers(us); setSess(email); boasVindas();
  }else{
    var u=us.find(function(x){return x.email===email;});
    if(!u){alert('Conta não encontrada! Crie uma conta.');return;}
    if(u.senha!==btoa(senha)){alert('Senha incorreta!');return;}
    setSess(email); boasVindas();
  }
};
function boasVindas(){
  var u=me();
  app.innerHTML='<div class="screen"><div class="gcard center" style="margin-top:40px"><div class="big">🎉</div><h2>Bem-vindo à gud store!</h2><p>A loja que você pode publicar seus apps, <b>boa e confiável!</b></p><p class="muted">Logado como <b>'+esc(u.nome)+'</b>'+(isDono(u)?' <span class="badge">👑 DONO</span>':'')+'</p><button class="gbtn" onclick="go(\'inicio\')">Ok, vamos lá!</button></div></div>';
}
// ============ LAYOUT PRINCIPAL ============
var TAB='inicio';
function layout(titulo,voltar,corpo){
  return '<div class="topbar">'+(voltar?'<button class="back" onclick="go(\'inicio\')"><span class="material-icons">arrow_back</span></button>':'')
  +'<div class="logo"><div class="mark">g</div><h2 style="font-size:22px">gud store</h2></div></div>'
  +'<div class="screen" style="padding-top:4px">'+corpo+'</div>'
  +'<nav class="bottomnav">'
  +tab('inicio','home','Início')+tab('jogos','sports_esports','Jogos')
  +'<button class="tab pub" onclick="go(\'publicar\')"><span class="material-icons">add</span>Publicar</button>'
  +tab('comunidade','groups','Comunidade')+tab('config','settings','Config')
  +'</nav>';
}
function tab(id,ico,nome){return '<button class="tab'+(TAB===id?' on':'')+'" onclick="go(\''+id+'\')"><span class="material-icons">'+ico+'</span>'+nome+'</button>';}
window.go=function(t){TAB=t;
  if(t==='inicio')telaInicio(); else if(t==='jogos')telaJogos(); else if(t==='comunidade')telaComunidade();
  else if(t==='publicar')pubEtapa(0); else if(t==='config')telaConfig(); else if(t==='editor')telaEditor();
};
function appCard(a,extra){
  return '<div class="appcard" onclick="verApp(\''+a.id+'\')"><img class="appicon" src="'+a.icon+'" onerror="this.style.display=\'none\'"><div class="inf"><b>'+esc(a.nome)+'</b><br><small>'+esc(a.empresa)+' • v'+esc(a.versao)+'</small></div><span class="material-icons" style="color:var(--tx2)">chevron_right</span></div>';
}
// ============ INÍCIO ============
function telaInicio(){
  var u=me(), as=todosApps().slice().reverse();
  var corpo='<div class="hero"><h2>👋 Olá, '+esc(u.nome.split(' ')[0])+'!</h2><p>Publique seus apps e jogos aqui. Boa e confiável! 💚</p></div>'
  +'<div class="gcard"><h3>🚀 Destaques</h3>'+(as.length?as.slice(0,3).map(appCard).join(''):'<p class="muted">Nenhum app ainda. Seja o primeiro!</p>')+'</div>'
  +'<button class="gbtn blue" onclick="go(\'editor\')"><span class="material-icons">build</span> Criar app no gud editor</button>'+'<button class="gbtn" onclick="pedirApp()"><span class="material-icons">send</span> Colocar meu app</button>'+'<button class="gbtn blue" onclick="importarPasta()"><span class="material-icons">folder_open</span> Importar pasta do app</button>';
  app.innerHTML=layout('gud store',false,corpo);
}
// ============ JOGOS ============
function telaJogos(){
  var as=todosApps().slice().reverse();
  app.innerHTML=layout('',false,'<div class="gcard"><h2>🎮 Jogos e Apps</h2><p class="muted">Tudo que foi publicado na gud store</p>'+(as.length?as.map(appCard).join(''):'<p class="muted">Ainda não há apps. Publique o primeiro!</p>')+'</div>');
}
// ============ COMUNIDADE ============
function telaComunidade(){
  var u=me(), meus=apps().filter(function(a){return a.donoEmail===u.email;}).reverse();
  var corpo='<div class="gcard"><h2>👥 Comunidade</h2><p class="muted">Os jogos que <b>você</b> publicou</p>'

function formaSVG(f,cor){var s='width="34" height="34" viewBox="0 0 34 34"';
  if(f==='circle')return '<svg '+s+'><circle cx="17" cy="17" r="13" fill="'+cor+'"/></svg>';
  if(f==='square')return '<svg '+s+'><rect x="6" y="6" width="22" height="22" rx="5" fill="'+cor+'"/></svg>';
  if(f==='triangle')return '<svg '+s+'><path d="M17 5 L30 28 L4 28 Z" fill="'+cor+'"/></svg>';
  if(f==='star')return '<svg '+s+'><path d="M17 3l4 9 10 1-7 7 2 10-9-5-9 5 2-10-7-7 10-1z" fill="'+cor+'"/></svg>';
  if(f==='hex')return '<svg '+s+'><path d="M17 3l11 7v14l-11 7-11-7V10z" fill="'+cor+'"/></svg>';
  if(f==='heart')return '<svg '+s+'><path d="M17 29S5 20 5 12c0-4 3-7 7-7 3 0 4 2 5 3 1-1 2-3 5-3 4 0 7 3 7 7 0 8-12 17-12 17z" fill="'+cor+'"/></svg>';
  if(f==='bolt')return '<svg '+s+'><path d="M19 3L7 19h8l-2 12 12-16h-8z" fill="'+cor+'"/></svg>';
  return '<svg '+s+'><path d="M17 4l8 13-8 13-8-13z" fill="'+cor+'"/></svg>';}
function iconeForma(f,cor){return 'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="'+cor+'"/><g transform="translate(20,20) scale(1.76)" fill="#fff">'+formaSVG(f,'#ffffff').replace(/<svg[^>]*>|<\/svg>/g,'')+'</g></svg>');}

var MODS=[/\bmod\b/i,/\bhack\b/i,/\bcrack\b/i,/\bcheat\b/i,/\btrainer\b/i,/dinheiro infinito/i,/unlimited money/i,/desbloqueado/i,/premium grátis/i,/premium gratis/i];
function ehMod(){var t=(PUB.nome+' '+PUB.descricao+' '+PUB.fileName).toLowerCase();return MODS.some(function(m){return m.test(t);});}
function rodarVerificacao(){
  var box=$('verifList');if(!box)return;
  var etapas=[
    {t:'Arquivo válido',ok:function(){return !!PUB.fileName;}},
    {t:'Verificando se é web view...',ok:function(){return true;},extra:function(){return PUB.fileType==='html'?'Sim':'Não';}},
    {t:'Verificando fotos e o app...',ok:function(){return true;}},
    {t:'Avaliando se pode ser publicado...',ok:function(){return !ehMod();}}
  ];
  var i=0;
  box.innerHTML=etapas.map(function(x){return '<div class="verif" id="vf'+etapas.indexOf(x)+'"><span class="spin"></span> '+x.t+'<span class="st wait">...</span></div>';}).join('');
  function prox(){
    if(i>=etapas.length){setTimeout(popupAntiMod,600);return;}
    var el=$('vf'+i), et=etapas[i];
    setTimeout(function(){
      var ok=et.ok();
      var txt=et.extra?et.extra():(ok?'Sim':'Não');
      el.innerHTML=(ok?'<span class="material-icons ok">check_circle</span>':'<span class="material-icons no">cancel</span>')+' '+et.t+'<span class="st '+(ok?'ok':'no')+'">'+txt+'</span>';
      if(!ok&&i===3){setTimeout(contaRemovida,900);return;}
      if(!ok){setTimeout(function(){alert('Verificação falhou: '+et.t);pubEtapa(5);},900);return;}
      i++; prox();
    },900);
  }
  prox();
}

  app.innerHTML=layout('',true,'<div class="gcard center"><h2>🎨 Ícone do app</h2><p class="muted">Formas geométricas grátis para uso!</p><img src="'+iconeForma(ED.formaIcon,ED.corIcon)+'" style="width:96px;height:96px;border-radius:24px"><div class="shapes">'+['circle','square','triangle','star','hex','heart','bolt','diamond'].map(function(f){return '<div class="shape'+(ED.formaIcon===f?' on':'')+'" onclick="ED.formaIcon=\''+f+'\';telaIconeEd()">'+formaSVG(f,'#fff')+'</div>';}).join('')+'</div><div class="colors">'+['#00e676','#00b0ff','#ffca28','#ff5252','#ab47bc','#ff9800'].map(function(c){return '<div class="color'+(ED.corIcon===c?' on':'')+'" style="background:'+c+'" onclick="ED.corIcon=\''+c+'\';telaIconeEd()"></div>';}).join('')+'</div><button class="gbtn" onclick="telaEditor()">Pronto!</button></div>');
};
window.telaPasta=function(){
  var nome=(ED.nome||'meu-app').toLowerCase().replace(/\s+/g,'-');
  app.innerHTML=layout('',true,'<div class="gcard"><h2>📁 Pasta do app</h2><p class="muted">Estrutura do seu projeto:</p><div class="tree">📁 '+esc(nome)+'/<br>├─ 📄 index.html<br>├─ 🎨 icon.svg<br>├─ 📜 script.js<br>└─ 🖼️ assets/ ('+ED.elementos.filter(function(e){return e.tipo==='imagem'||e.tipo==='video';}).length+' arquivos)</div><p class="muted">'+ED.elementos.length+' elementos no app</p><button class="gbtn" onclick="telaEditor()">Voltar</button></div>');
};
window.telaAjuda=function(){
  app.innerHTML=layout('',true,'<div class="gcard"><h2>❓ Ajuda</h2><h3>Como criar um app</h3><p style="font-size:14px">1️⃣ Escolha o que adicionar: <b>botão, texto, imagem, vídeo</b> ou <b>input</b>.<br>2️⃣ Toque no elemento para <b>editar o texto, a cor</b> e <b>mover</b> com as setas.<br>3️⃣ Use o <b>Script</b> para programar em JavaScript: ex. <code>alert("oi!")</code>.<br>4️⃣ Escolha um <b>ícone</b> grátis e veja a <b>pasta</b> do projeto.<br>5️⃣ Toque em <b>Publicar</b> e siga o processo da loja!</p><h3>Não sabe programar? 🤖</h3><p style="font-size:14px">Você pode <b>aprender</b> aos poucos ou <b>usar uma inteligência artificial</b> para te ajudar a escrever os códigos. É só pedir: "crie um botão que mostra uma mensagem"!</p><button class="gbtn" onclick="telaEditor()">Ok, entendi!</button></div>');
};
function gerarHTMLApp(){
  var nome=ED.nome||'Meu App';
  var corpo=ED.elementos.map(function(e){
    var st='position:absolute;left:'+e.x+'px;top:'+e.y+'px;';
    if(e.tipo==='texto')return '<div style="'+st+'font-size:'+e.size+'px;color:'+e.cor+'">'+esc(e.texto)+'</div>';
    if(e.tipo==='botao')return '<button onclick="acaoBotao()" style="'+st+'background:'+e.cor+';color:#fff;border:none;border-radius:10px;padding:10px 18px;font-size:'+e.size+'px">'+esc(e.texto)+'</button>';
    if(e.tipo==='imagem'&&e.src)return '<img src="'+e.src+'" style="'+st+'width:'+e.w+'px;height:'+e.h+'px;object-fit:cover;border-radius:8px">';
    if(e.tipo==='video'&&e.src)return '<video src="'+e.src+'" style="'+st+'width:'+e.w+'px" controls></video>';
    if(e.tipo==='input')return '<input placeholder="'+esc(e.texto)+'" style="'+st+'padding:10px;border-radius:10px;border:1px solid #888;width:'+e.w+'px;font-size:'+e.size+'px">';
    return '';
  }).join('\n');
  return '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(nome)+'</title></head><body style="margin:0;font-family:sans-serif;position:relative;min-height:100vh;background:#0d1621;color:#fff">\n'+corpo+'\n<script>\nfunction acaoBotao(){alert("Botão clicado!");}\n'+ED.script+'\n<\/script></body></html>';
}
window.editorPublicar=function(){
  ED.nome=($('edNome')&&$('edNome').value)||ED.nome||'Meu App';
  if(!ED.elementos.length){alert('Adicione pelo menos um elemento ao app!');return;}
  var h=gerarHTMLApp();
  PUB={etapa:1,nome:ED.nome,descricao:'',fotos:[],icon:iconeForma(ED.formaIcon,ED.corIcon),iconUp:false,formaIcon:ED.formaIcon,corIcon:ED.corIcon,empresa:'',fileName:ED.nome.replace(/\s+/g,'-')+'.html',fileType:'html',fileData:'data:text/html;charset=utf-8,'+encodeURIComponent(h)};
  TAB='publicar';renderPub();
  popup('<div class="big">📦</div><h3>App montado!</h3><p>Seu HTML foi gerado. Complete a descrição e publique!</p><button class="gbtn" onclick="fecharPopup()">Continuar</button>');
};
// ============ POPUP ============
function popup(html){var d=document.createElement('div');d.className='popup';d.id='ppx';d.innerHTML='<div class="box">'+html+'</div>';document.body.appendChild(d);}
window.fecharPopup=function(){var d=$('ppx');if(d)d.remove();};

if(sess()&&me()){boasVindas();}else{telaLogin('entrar');}
carregarAppsSite();
