<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>stylus get right</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
:root{--primary:#0b5ed7;--on-primary:#fff;--surface:#ffffff;--bg:#f2f6ff;--outline:#cfe3ff;--text:#1a1c1e;--text2:#5a5f66;--card-shadow:0 1px 4px rgba(0,0,0,.12)}
body.dark{--primary:#7aa8ff;--on-primary:#002f6b;--surface:#1e2023;--bg:#121316;--outline:#33373d;--text:#e3e2e6;--text2:#a8adb5;--card-shadow:0 1px 6px rgba(0,0,0,.5)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Roboto',system-ui,sans-serif;user-select:none;-webkit-user-select:none}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);position:fixed;width:100%;height:100%;touch-action:manipulation;transition:background .3s,color .3s}
#app{width:100%;height:100dvh;display:flex;flex-direction:column}
#boot{position:fixed;inset:0;background:#0b5ed7;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:bootBg 2.8s forwards}
@keyframes bootBg{0%{background:#0b5ed7}70%{background:#0b5ed7}100%{background:transparent;opacity:0;pointer-events:none}}
.boot-logo{font-size:52px;font-weight:700;color:#fff;letter-spacing:2px;opacity:0;animation:bootText 2.2s ease forwards}
.boot-logo span{color:#ffde59}
@keyframes bootText{0%{opacity:0;transform:scale(.7) translateY(20px);letter-spacing:12px}30%{opacity:1;transform:scale(1.05) translateY(0)}50%{transform:scale(1);letter-spacing:2px}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}
.boot-bar{width:160px;height:4px;background:rgba(255,255,255,.25);border-radius:4px;margin-top:24px;overflow:hidden;opacity:0;animation:bootText 2.2s ease forwards}
.boot-bar div{height:100%;width:0;background:#fff;border-radius:4px;animation:load 2s ease forwards}
@keyframes load{to{width:100%}}
.boot-sub{color:rgba(255,255,255,.85);font-size:13px;margin-top:12px;opacity:0;animation:bootText 2.2s ease forwards}
.topbar{background:var(--primary);color:var(--on-primary);padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:50;transition:background .3s}
.topbar h1{font-size:20px;font-weight:500;flex:1}
.iconbtn{background:none;border:none;color:inherit;padding:8px;border-radius:50%;display:flex}
.iconbtn:active{background:rgba(128,128,128,.2)}
.content{flex:1;overflow-y:auto;padding:16px 16px 90px;-webkit-overflow-scrolling:touch}
.tela{animation:fade.25s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
.mcard{background:var(--surface);color:var(--text);border-radius:20px;padding:18px;margin:10px 0;box-shadow:var(--card-shadow);animation:pop.3s;transition:background .3s}
.mcard h2{color:var(--primary);font-size:18px;font-weight:500;margin-bottom:10px}
.mcard p{color:var(--text2);font-size:14px;line-height:1.5}
.mbtn{background:var(--primary);color:var(--on-primary);border:none;border-radius:24px;padding:14px 24px;font-size:15px;font-weight:500;width:100%;margin:6px 0;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.mbtn:active{filter:brightness(.92)}
.mbtn.outlined{background:transparent;color:var(--primary);border:1.5px solid var(--primary);box-shadow:none}
.opt{display:flex;align-items:center;gap:14px;padding:15px 12px;border-radius:14px;margin:6px 0;background:var(--surface);border:1.5px solid var(--outline);color:var(--text)}
.opt.sel{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,var(--surface))}
.opt .material-icons{color:var(--primary);font-size:28px}
.fab{position:fixed;bottom:90px;right:18px;width:60px;height:60px;border-radius:18px;background:var(--primary);color:var(--on-primary);border:none;box-shadow:0 4px 14px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;z-index:60}
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);display:flex;box-shadow:0 -2px 10px rgba(0,0,0,.12);padding-bottom:env(safe-area-inset-bottom);z-index:55;transition:background .3s}
.navitem{flex:1;background:none;border:none;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text2);font-size:12px;font-weight:500}
.navitem.active{color:var(--primary)}
input[type=range]{width:100%;height:40px;accent-color:var(--primary)}
input[type=text]{width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--outline);margin-top:8px;font-size:15px;background:var(--surface);color:var(--text)}
.chip{display:inline-block;background:color-mix(in srgb,var(--primary) 18%,var(--surface));color:var(--primary);border-radius:16px;padding:6px 14px;font-size:13px;font-weight:500;margin:4px 4px 0 0}
.loader{border:4px solid var(--outline);border-top:4px solid var(--primary);border-radius:50%;width:44px;height:44px;animation:girar.8s linear infinite;margin:15px auto}
@keyframes girar{to{transform:rotate(360deg)}}
.splashlogo{width:110px;height:110px;border-radius:32px;background:var(--primary);display:flex;align-items:center;justify-content:center;margin:30px auto;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:pop.5s}
.splashlogo .material-icons{font-size:64px;color:var(--on-primary)}
.switchrow{display:flex;align-items:center;justify-content:space-between;padding:16px 4px}
.switch{position:relative;width:52px;height:32px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#7a7a;border-radius:34px;transition:.3s;cursor:pointer}
.slider:before{position:absolute;content:"";height:24px;width:24px;left:4px;top:4px;background:#fff;border-radius:50%;transition:.3s;box-shadow:0 2px 4px rgba(0,0,0,.3)}
input:checked + .slider{background:var(--primary)}
input:checked + .slider:before{transform:translateX(20px)}
.sid-head{background:linear-gradient(135deg,#7b1fa2,#4a148c);border-radius:18px;padding:22px 16px;color:#fff;text-align:center;margin-bottom:12px}.sid-head h2{color:#fff;margin:6px 0}.avatar{border-radius:50%;object-fit:cover;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:var(--primary);overflow:hidden;flex-shrink:0}.chat{display:flex;flex-direction:column;gap:8px;max-height:44vh;overflow-y:auto;padding:2px}.bubble-bot{background:var(--surface);color:var(--text);border-radius:4px 16px 16px 16px;padding:10px 14px;max-width:88%;align-self:flex-start;font-size:15px;line-height:1.45}.bubble-user{background:var(--primary);color:var(--on-primary);border-radius:16px 4px 16px 16px;padding:10px 14px;max-width:88%;align-self:flex-end;font-size:15px;line-height:1.45}.acc-card{display:flex;gap:10px;align-items:center;background:var(--bg);border:2px solid var(--outline);border-radius:14px;padding:8px;margin-top:8px}.ct-inp{width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--outline);background:var(--bg);color:var(--text);font-size:16px;margin-bottom:10px;box-sizing:border-box;font-family:inherit}
#gameWrap{flex:1;display:flex;flex-direction:column;width:100%;background:#0a2a5e;position:relative}
body.dark #gameWrap{background:#0a0f1e}
#piano{flex:1;position:relative;overflow:hidden;touch-action:none}
#piano.bgmedia{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.45;pointer-events:none}
.lane{position:absolute;top:0;bottom:0;width:25%;border-right:1px solid rgba(255,255,255,.12);pointer-events:none}
.hitline{position:absolute;bottom:90px;left:0;right:0;height:4px;background:#ffde59;z-index:5;box-shadow:0 0 10px #ffde59}
.tile{position:absolute;border-radius:10px;z-index:10;border:3px solid #0b5ed7;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.tile.longa{background:linear-gradient(180deg,#fff,#9cc8ff)}
.tile.gigante{border-color:#ff4081;border-width:4px}
.tile.pequena{border-color:#00e5ff}
#combo{position:absolute;top:50px;width:100%;text-align:center;color:#fff;font-size:24px;font-weight:bold;z-index:20;pointer-events:none;text-shadow:0 2px 8px #000}
.particle{position:absolute;width:10px;height:10px;border-radius:50%;pointer-events:none;z-index:50}
@keyframes explodir{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.flash{position:absolute;inset:0;background:#fff;opacity:.35;pointer-events:none;z-index:40;animation:flashout.25s forwards}
@keyframes flashout{to{opacity:0}}
.pcats{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}.pcat{flex:1 0 auto;background:transparent;border:1.5px solid var(--outline);color:var(--text2);border-radius:16px;padding:10px 16px;font-size:14px;font-weight:500;font-family:inherit}.pcat.sel{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pitem{background:var(--bg);border:2px solid var(--outline);border-radius:16px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:inherit;transition:border-color .25s}.pitem.sel{border-color:var(--primary)}.pitem img{width:100%;height:84px;object-fit:contain;pointer-events:none}.pitem span{font-size:11px;color:var(--text2);text-align:center;line-height:1.35;max-height:30px;overflow:hidden;pointer-events:none}#personPreview{position:relative;width:100%;height:300px;margin-bottom:12px}
#gameWrap.pianobg{background:linear-gradient(180deg,#1b1b33 0%,#0b0b18 100%)}
.pianokeys{position:absolute;left:0;right:0;bottom:0;height:130px;z-index:2;pointer-events:none;background:#fdfdfd;border-top:4px solid #000}
.pianokeys .wkey{position:absolute;top:0;bottom:0;border-right:2px solid #444}
.pianokeys .bkey{position:absolute;top:0;width:6.4%;height:58%;background:#111;border-radius:0 0 8px 8px;z-index:3}
#mascotWall{position:fixed;inset:0;z-index:0;background:var(--bg);display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:.16}
#mascotWall .mstack{position:relative;width:72vmin;height:72vmin}
#mascotWall .mstack img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
body.haswall{background:transparent}
body.haswall #app{position:relative;z-index:1}
body.haswall .content{background:transparent}
#endScreen{display:none;position:fixed;inset:0;background:var(--bg);z-index:100;align-items:center;justify-content:center;flex-direction:column;padding:20px}
</style>
</head>
<body>
<div id="boot"><div class="boot-logo">stylus<span>.</span></div><div class="boot-sub">get right</div><div class="boot-bar"><div></div></div></div>
<div id="app"></div>
<input type="file" id="importGeral" accept="audio/*,.stylus" style="display:none">
<script>
const app=document.getElementById('app');
let FASE={fundo:'azul',velMus:1,velNotas:1,afinidade:'',notas:[],musicaNome:'',vidas:5,bgURL:'',bgTipo:''};
let FASES_PUB=[]; let ETAPA=0; let ABA='home';
let DARK = localStorage.getItem('sgr_dark')==='1';
const MUSICA_LOCAL_NOME="Me Leva Mais Alto feat. Arthur Henrique John Stecca-EUNCga2IQ18.mp3";
function applyDark(){document.body.classList.toggle('dark',DARK);localStorage.setItem('sgr_dark',DARK?'1':'0')}
applyDark();
setTimeout(()=>{document.getElementById('boot').remove();showSplash();},2900);
function topbar(titulo,voltar){
return `<div class="topbar">${voltar?'<button class="iconbtn" onclick="showHome()"><span class="material-icons">arrow_back</span></button>':'<span class="material-icons">piano</span>'}<h1>${titulo}</h1><div style="display:flex;align-items:center;gap:2px"><button class="iconbtn" onclick="navGo('conta')" style="padding:6px">${contaAvatarTop()}</button><button class="iconbtn" onclick="showSettings()"><span class="material-icons">settings</span></button></div></div>`;
}
function bottomnav(){
const item=(id,icon,label)=>`<button class="navitem ${ABA===id?'active':''}" onclick="navGo('${id}')"><span class="material-icons">${icon}</span>${label}</button>`;
return `<div class="bottomnav">${item('home','home','Início')}${item('criar','add_circle','Criar')}${item('jogar','public','Fases')}${item('locais','music_note','Comunidade')}${item('person','person','stylus.person')}${item('conta','account_circle','Conta')}</div>`;
}
function navGo(id){ABA=id;if(id==='home')showHome();if(id==='criar')showCriar(0);if(id==='jogar')showJogar();if(id==='locais')showLocais();if(id==='person')showPerson();if(id==='conta')showConta();}
function layout(t,v,c,fab){return `${topbar(t,v)}<div class="content"><div class="tela">${c}</div></div>${fab||''}${bottomnav()}`}
function showSettings(){
ABA='settings';
app.innerHTML=layout('Configurações',true,`
<div class="mcard"><h2><span class="material-icons" style="vertical-align:middle">palette</span> Aparência</h2>
<div class="switchrow"><div><b>Modo escuro</b><br><small style="color:var(--text2)">Tema escuro estilo Android 14</small></div>
<label class="switch"><input type="checkbox" ${DARK?'checked':''} onchange="toggleDark(this.checked)"><span class="slider"></span></label></div>
</div>
<div class="mcard"><h2><span class="material-icons" style="vertical-align:middle">info</span> Sobre</h2><p><b>stylus get right</b> v2.0<br>Inspirado em piano tiles.<br>Feito com 💙 em azul e branco.</p></div>
<button class="mbtn outlined" onclick="showHome()"><span class="material-icons">home</span> Voltar ao início</button>`);
}
function toggleDark(v){DARK=v;applyDark();}
function showSplash(){
ABA='home';
app.innerHTML=`${topbar('stylus get right',false)}<div class="content"><div class="tela" style="text-align:center">
<div class="splashlogo"><span class="material-icons">piano</span></div>
<h1 style="color:var(--primary);font-size:28px;font-weight:700">stylus get right</h1>
<div class="mcard" style="max-width:340px;margin:16px auto"><p>O jogo é inspirado em jogos de piano tiles.<br><br>Toque nas notas no ritmo da música!</p></div>
<button class="mbtn" style="max-width:340px;margin:0 auto" onclick="showHome()">Ok <span class="material-icons">check</span></button></div></div>${bottomnav()}`;
}
function showHome(){
ABA='home';
app.innerHTML=layout('stylus get right',false,`
<div class="mcard"><h2>👋 Bem-vindo!</h2><p>Escolha o que fazer:</p></div>
<button class="mbtn" onclick="showCriar(0)"><span class="material-icons">palette</span> Criar minhas fases</button>
<button class="mbtn" onclick="showJogar()"><span class="material-icons">public</span> Jogar fases dos outros</button>
<button class="mbtn outlined" onclick="showLocais()"><span class="material-icons">folder</span> Fases locais</button>
<button class="mbtn outlined" onclick="document.getElementById('importGeral').click()"><span class="material-icons">file_upload</span> Importar música / .stylus</button>
<div class="mcard"><p style="font-size:12px"><span class="material-icons" style="font-size:16px;vertical-align:middle">info</span> musicas da pasta dos arquivos do app</p></div>
`,`<button class="fab" onclick="showCriar(0)"><span class="material-icons">add</span></button>`);
}
function showCriar(et){
ABA='criar';ETAPA=et;let inner='';
if(et===0)inner=`<h2>Escolha um fundo para sua fase</h2>
<div class="opt ${FASE.fundo==='azul'?'sel':''}" onclick="FASE.fundo='azul';showCriar(0)"><span class="material-icons">square</span><div><b>Azul clássico</b></div></div>
<div class="opt ${FASE.fundo==='branco'?'sel':''}" onclick="FASE.fundo='branco';showCriar(0)"><span class="material-icons">square</span><div><b>Branco clean</b></div></div>
<div class="opt ${FASE.fundo==='interativo'?'sel':''}" onclick="FASE.fundo='interativo';showCriar(0)"><span class="material-icons">auto_awesome</span><div><b>Interativo</b></div></div>
<div class="mcard"><h2>Fundo personalizado</h2><input type="file" id="bgInp" accept="image/*,video/*"><div id="bgInfo"></div><small style="color:var(--text2)">Aceita foto ou vídeo</small></div>`;
if(et===1)inner=`<h2>Escolha a música de fundo</h2><div class="mcard" style="text-align:center"><span class="material-icons" style="font-size:40px;color:var(--primary)">audio_file</span><br><input type="file" id="inpMus" accept="audio/*"><div id="musInfo"></div><br><button class="mbtn outlined" onclick="document.getElementById('importGeral').click()"><span class="material-icons">file_upload</span> Ou importar música / .stylus</button></div>`;
if(et===2)inner=`<h2>Velocidade e vidas</h2><div class="mcard">
<label><b>🎵 Música: <span id="vv1">${FASE.velMus}</span>x</b></label><input type="range" min="0.5" max="2" step="0.1" value="${FASE.velMus}" oninput="FASE.velMus=this.value;document.getElementById('vv1').innerText=this.value">
<label><b>⚡ Notas: <span id="vv2">${FASE.velNotas}</span>x</b></label><input type="range" min="0.5" max="3" step="0.1" value="${FASE.velNotas}" oninput="FASE.velNotas=this.value;document.getElementById('vv2').innerText=this.value"></div>
<div class="mcard"><h2>❤️ Modo de vida</h2><p>Quantas vezes pode errar até perder?</p></div>
<div class="opt ${FASE.vidas===3?'sel':''}" onclick="FASE.vidas=3;showCriar(2)"><span class="material-icons">favorite</span><b>3 vidas</b></div>
<div class="opt ${FASE.vidas===5?'sel':''}" onclick="FASE.vidas=5;showCriar(2)"><span class="material-icons">favorite</span><b>5 vidas</b></div>
<div class="opt ${FASE.vidas===10?'sel':''}" onclick="FASE.vidas=10;showCriar(2)"><span class="material-icons">favorite</span><b>10 vidas</b></div>
<div class="opt ${FASE.vidas===999?'sel':''}" onclick="FASE.vidas=999;showCriar(2)"><span class="material-icons">all_inclusive</span><b>Infinito</b></div>
<input type="text" placeholder="Afinidade (opcional)" value="${FASE.afinidade}" oninput="FASE.afinidade=this.value">`;
if(et===3)inner=`<h2>Gerar notas</h2><div id="loadArea"></div>
<button class="mbtn" onclick="gerarAuto()"><span class="material-icons">mic</span> Gerar pelas vozes</button>
<button class="mbtn outlined" onclick="gerarManual()"><span class="material-icons">touch_app</span> Criar manual</button><div id="genMsg"></div>
<div class="mcard"><p style="font-size:12px">💡 Agudo = nota pequena, grave = nota gigante. Sincronizado com a música.</p></div>`;
const steps=`<div style="display:flex;gap:4px;margin:10px 0">${[0,1,2,3].map(i=>`<div style="flex:1;height:4px;border-radius:2px;background:${i<=et?'var(--primary)':'var(--outline)'}"></div>`).join('')}</div>`;
app.innerHTML=layout('Criar fase',true,`${steps}<div class="mcard">${inner}</div><div style="display:flex;gap:8px">${et>0?'<button class="mbtn outlined" onclick="showCriar('+(et-1)+')">Voltar</button>':''}${et<3?'<button class="mbtn" onclick="showCriar('+(et+1)+')">Próximo</button>':''}</div>`);
if(et===0){document.getElementById('bgInp').addEventListener('change',function(){const f=this.files[0];if(!f)return;FASE.bgURL=URL.createObjectURL(f);FASE.bgTipo=f.type.startsWith('video')?'video':'img';document.getElementById('bgInfo').innerHTML='<span class="chip">✅ Fundo carregado!</span>';});}
if(et===1){document.getElementById('inpMus').addEventListener('change',function(){const f=this.files[0];if(!f)return;FASE.musicaURL=URL.createObjectURL(f);FASE.musicaNome=f.name;FASE.musicaFile=f;document.getElementById('musInfo').innerHTML='<span class="chip">✅ '+f.name+'</span>';});}
}
async function gerarAuto(){
const msg=document.getElementById('genMsg'),load=document.getElementById('loadArea');
if(!FASE.musicaFile&&!FASE.musicaURL){msg.innerHTML='<div class="mcard">❌ Escolha uma música!</div>';return}
load.innerHTML='<div class="loader"></div><p style="text-align:center">Analisando vozes...</p>';
try{
const ctx=new (window.AudioContext||window.webkitAudioContext)();
let ab=FASE.musicaFile?await FASE.musicaFile.arrayBuffer():await (await fetch(FASE.musicaURL)).arrayBuffer();
const audio=await ctx.decodeAudioData(ab);const ch=audio.getChannelData(0),sr=audio.sampleRate,notas=[],win=Math.floor(sr*0.3);let lastLane=-1;
for(let i=0;i<ch.length;i+=win){let e=0,zc=0,prev=0;for(let j=i;j<Math.min(i+win,ch.length);j++){e+=Math.abs(ch[j]);if(prev&&Math.sign(ch[j])!==Math.sign(prev))zc++;prev=ch[j]}e/=win;const pitch=zc/(win/sr);
if(e>0.06){let lane;do{lane=Math.floor(Math.random()*4)}while(lane===lastLane);lastLane=lane;let tm='normal';if(pitch>1800)tm='pequena';else if(pitch<600)tm='gigante';notas.push({t:i/sr,lane,longa:e>0.20,tamanho:tm});}}
FASE.notas=notas;load.innerHTML='';msg.innerHTML='<div class="mcard">✅ '+notas.length+' notas!</div>';setTimeout(finalizar,900);
}catch(e){load.innerHTML='';gerarManual()}
}
function gerarManual(){const n=[];let l=0;for(let i=0;i<50;i++){n.push({t:i*0.55,lane:l,longa:i%9===0,tamanho:i%7===0?'gigante':i%5===0?'pequena':'normal'});l=(l+1+Math.floor(Math.random()*2))%4}FASE.notas=n;finalizar()}
function finalizar(){FASE.id=Date.now();FASE.nome=FASE.musicaNome||'Minha fase';FASES_PUB.push(JSON.parse(JSON.stringify(FASE)));startGame(FASE)}
function showJogar(){
ABA='jogar';let h='<div class="mcard"><h2>🌍 Fases dos outros</h2><p>Fases publicadas</p></div>';

 }catch(e){

function jogarLocal(){document.getElementById('lload').innerHTML='<div class="loader"></div>';const inp=document.createElement('input');inp.type='file';inp.accept='audio/*';inp.onchange=()=>{const f=inp.files[0];if(!f)return;window._musicaAtual={titulo:f.name,origem:'importada'};FASE={fundo:'azul',velMus:1,velNotas:1,afinidade:'',notas:[],musicaNome:f.name,musicaURL:URL.createObjectURL(f),musicaFile:f,vidas:5,bgURL:'',bgTipo:'',id:Date.now(),nome:f.name};gerarAutoLocal()};setTimeout(()=>inp.click(),400)}
async function gerarAutoLocal(){
app.innerHTML='<div class="content"><div class="loader"></div><p style="text-align:center">Analisando vozes...</p></div>';
try{const ctx=new (window.AudioContext||window.webkitAudioContext)();const ab=FASE.musicaFile?await FASE.musicaFile.arrayBuffer():FASE.musicaBuffer;const audio=await ctx.decodeAudioData(ab);const ch=audio.getChannelData(0),sr=audio.sampleRate,notas=[],win=Math.floor(sr*0.3);let lastLane=-1;
for(let i=0;i<ch.length;i+=win){let e=0,zc=0,prev=0;for(let j=i;j<Math.min(i+win,ch.length);j++){e+=Math.abs(ch[j]);if(prev&&Math.sign(ch[j])!==Math.sign(prev))zc++;prev=ch[j]}e/=win;const pitch=zc/(win/sr);if(e>0.06){let lane;do{lane=Math.floor(Math.random()*4)}while(lane===lastLane);lastLane=lane;let tm='normal';if(pitch>1800)tm='pequena';else if(pitch<600)tm='gigante';notas.push({t:i/sr,lane,longa:e>0.2,tamanho:tm})}}
FASE.notas=notas;startGame(FASE);}catch(e){gerarManual()}
}

document.getElementById('importGeral').addEventListener('change', async function(e){

  try{ const texto=await file.text(); const d=JSON.parse(texto); if(d&&d.app==='stylus'&&d.fase){ sdata=d; } }catch(_){}
  if(sdata){
    const f=sdata.fase;window._musicaAtual={titulo:f.nome||'Fase importada',origem:'importada'}; f.id=Date.now(); f.fundo=f.fundo||'azul'; f.nome=f.nome||'Fase importada'; f.musicaNome=f.nome;

function personCatOf(name){const n=name.toLowerCase();
 if(n.indexOf('cabelo')>=0||n.indexOf('chapeu')>=0||n.indexOf('chap\u00e9u')>=0)return 'cabelo';
 if(n.indexOf('calca')>=0||n.indexOf('cal\u00e7a')>=0)return 'calca';
 if(n.indexOf('rosto')>=0)return 'rosto';
 if(n.indexOf('roupa')>=0)return 'roupa';
 if(n.indexOf('person')>=0)return 'base';
 return 'extra';}
function personPath(name){return 'stylus.person/'+encodeURI(name);}
function personName(name){return name.replace(/\.png$/i,'');}
function personItems(){return PERSON_CATALOG.map(n=>({name:n,cat:personCatOf(n),url:personPath(n)}));}
function personSelection(){
 let saved={}; try{saved=JSON.parse(localStorage.getItem('sgr_person')||'{}');}catch(_){}
 const items=personItems(), sel={};
 Object.keys(PERSON_CATS).forEach(cat=>{
  let names=saved[cat];
  if(typeof names==='string')names=[names];
  if(!Array.isArray(names))names=[];
  let arr=names.map(nm=>items.find(x=>x.cat===cat&&x.name===nm)).filter(Boolean);
  if(!arr.length){const first=items.find(x=>x.cat===cat); if(first)arr=[first];}
  sel[cat]=arr;
 });
 return sel;}
function personSaveSelection(sel){try{const o={};Object.keys(sel).forEach(c=>{o[c]=sel[c].map(x=>x.name);});localStorage.setItem('sgr_person',JSON.stringify(o));}catch(_){}}
function personMixing(sel){return Object.keys(sel).some(c=>sel[c].length>1);}

function personApply(cat,name,btn){

 const item=items.find(x=>x.cat===cat&&x.name===name); if(!item)return;
 const arr=sel[cat], ix=arr.findIndex(x=>x.name===name);
 if(ix>=0)arr.splice(ix,1); else arr.push(item);
 personSaveSelection(sel); renderWall(); showPerson();
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function contasTodas(){try{return JSON.parse(localStorage.getItem('sgr_accounts')||'[]');}catch(_){return[];}}
function contasSalvarTodas(l){try{localStorage.setItem('sgr_accounts',JSON.stringify(l));}catch(_){}}
function contaAtual(){var n=localStorage.getItem('sgr_session');if(!n)return null;return contasTodas().find(function(a){return a.nome===n;})||null;}
function contaUpsert(acc){var l=contasTodas();var i=l.findIndex(function(a){return a.nome===acc.nome;});if(i>=0)l[i]=acc;else l.push(acc);contasSalvarTodas(l);}
function contaSomarPontos(p){var a=contaAtual();if(!a||!p)return;a.pontos=(a.pontos||0)+p;contaUpsert(a);}
function contaRegistrarMusica(titulo,origem){var a=contaAtual();if(!a)return;a.ultimaMusica={titulo:titulo,origem:origem,quando:Date.now()};a.historico=a.historico||[];a.historico.push({titulo:titulo,origem:origem,quando:Date.now()});if(a.historico.length>60)a.historico=a.historico.slice(-60);contaUpsert(a);}

function contaCriar(){
 var nome=(document.getElementById('ctNome').value||'').trim();
 var senha=document.getElementById('ctSenha').value||'';
 if(nome.length<2){alert('Escolha um nome com pelo menos 2 letras');return;}
 if(senha.length<3){alert('A senha precisa de pelo menos 3 caracteres');return;}
 if(contasTodas().some(function(a){return a.nome.toLowerCase()===nome.toLowerCase();})){alert('Esse nome já está em uso');return;}
 contaUpsert({nome:nome,senha:senha,foto:window._novaFoto||'',criadoEm:Date.now(),pontos:0,historico:[],ultimaMusica:null});
 localStorage.setItem('sgr_session',nome);window._novaFoto='';
 showConta();
}
function contaEntrar(){
 var nome=(document.getElementById('ctNome').value||'').trim();
 var senha=document.getElementById('ctSenha').value||'';
 var acc=contasTodas().find(function(a){return a.nome.toLowerCase()===nome.toLowerCase();});
 if(!acc){alert('Conta não encontrada');return;}
 if(acc.senha!==senha){alert('Senha incorreta');return;}
 localStorage.setItem('sgr_session',acc.nome);window._novaFoto='';
 showConta();
}
function contaSair(){localStorage.removeItem('sgr_session');showConta();}
function contaFotoGaleria(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){window._novaFoto=r.result;showConta();};r.readAsDataURL(f);}
function contaUsarMascote(){
 var sel=personSelection();var urls=[];
 PERSON_ORDER.forEach(function(c){sel[c].forEach(function(p){urls.push(p.url);});});
 if(!urls.length){alert('Monte seu mascote na aba stylus.person primeiro');return;}
 var imgs=urls.map(function(u){var im=new Image();im.src=u;return im;});
 var n=0;
 imgs.forEach(function(im){im.onload=im.onerror=function(){if(++n===imgs.length){
  var c=document.createElement('canvas');c.width=512;c.height=512;var x=c.getContext('2d');
  imgs.forEach(function(m2){try{x.drawImage(m2,0,0,512,512);}catch(_){}});
  window._novaFoto=c.toDataURL('image/png');showConta();
 };};});
}

  var ph={inicio:'Descreva o problema...',nome:'Nome da conta...',digitos:'O que você lembra...',nova_senha:'Nova senha...',confirma_senha:'Confirme a senha...'}[et];
  var tp=(et==='nova_senha'||et==='confirma_senha')?'password':'text';
  bi.innerHTML='<div style="display:flex;gap:8px"><input id="botTxt" type="'+tp+'" placeholder="'+ph+'" class="ct-inp" style="margin:0;flex:1"><button class="mbtn" style="width:auto;padding:12px 18px" onclick="botEnviar()">Enviar</button></div>'
  +(et==='nome'?'<div style="margin-top:8px;text-align:center"><button class="mbtn outlined" style="width:auto" onclick="botEtapaFoto()"><span class="material-icons">photo</span> Tenho a foto de perfil</button><input type="file" id="botFotoInp" accept="image/*" style="display:none" onchange="botReceberFoto(this)"></div>':'');
 }else if(et==='foto'){
  bi.innerHTML='<div style="text-align:center"><button class="mbtn" onclick="document.getElementById(\'botFotoInp\').click()"><span class="material-icons">photo</span> Enviar foto de perfil</button><input type="file" id="botFotoInp" accept="image/*" style="display:none" onchange="botReceberFoto(this)"></div>';
 }else if(et==='verificando'){
  bi.innerHTML='<div style="text-align:center;padding:10px"><div class="loader"></div><p>verificando......</p></div>';
 }else if(et==='escolha_conta'){
  var cards='';
  contasTodas().forEach(function(a){cards+='<div class="acc-card">'+contaAvatarHTML(a,48)+'<div style="flex:1"><b>'+esc(a.nome)+'</b></div><button class="mbtn" style="width:auto;padding:8px 14px" onclick="botEscolherConta(this)" data-n="'+esc(a.nome)+'">É essa! ✅</button></div>';});
  cards+='<div style="text-align:center;margin-top:8px"><button class="mbtn outlined" style="width:auto" onclick="botNenhumaConta()">Nenhuma dessas</button></div>';
  bi.innerHTML=cards;
 }else if(et==='origem_musica'){
  bi.innerHTML='<div style="display:flex;gap:8px"><button class="mbtn" onclick="botOrigemMusica(\'comunidade\')">🎵 Comunidade</button><button class="mbtn outlined" onclick="botOrigemMusica(\'importada\')">📥 Importada</button></div>';
 }else if(et==='lista_musicas'){
  var its=[];
  if(BOT.origem==='comunidade'){its=MUSIC_CATALOG.map(function(m){return m.titulo;});}
  else{var h2={};(BOT.alvo.historico||[]).forEach(function(x){if(x.origem==='importada')h2[x.titulo]=1;});its=Object.keys(h2);}
  if(!its.length){bi.innerHTML='<p style="text-align:center;color:var(--text2)">Não achei músicas aqui. 😕</p><div style="text-align:center"><button class="mbtn outlined" style="width:auto" onclick="botFimFalha()">Ok</button></div>';}
  else{bi.innerHTML=its.map(function(t){return '<div class="acc-card"><span class="material-icons" style="color:var(--primary)">music_note</span><div style="flex:1"><b>'+esc(t)+'</b></div><button class="mbtn outlined" style="width:auto;padding:8px 14px" data-t="'+esc(t)+'" onclick="botEscolherMusica(this)">Escolher</button></div>';}).join('');}
 }else if(et==='confirma_musica'){
  bi.innerHTML='<p style="text-align:center">Você escolheu <b>'+esc(BOT.musicaEscolhida)+'</b>.</p><div style="display:flex;gap:8px"><button class="mbtn" onclick="botConfirmaMusica1()">Confirmar</button><button class="mbtn outlined" onclick="botEtapaLista()">Escolher outra</button></div>';
 }else if(et==='confirma_musica2'){
  bi.innerHTML='<p style="text-align:center"><b>Confirmar mesmo?</b></p><div style="display:flex;gap:8px"><button class="mbtn" onclick="botConfirmaMusica2()">Confirmar</button><button class="mbtn outlined" onclick="botEtapaLista()">Voltar</button></div>';
 }else if(et==='fim'){
  bi.innerHTML='<div style="text-align:center"><button class="mbtn" onclick="showConta()"><span class="material-icons">login</span> Ok, ir para o login</button></div>';
 }
 var c=document.getElementById('botChat');if(c)c.scrollTop=c.scrollHeight;
}
function botEnviar(){
 var inp=document.getElementById('botTxt');var t=(inp.value||'').trim();if(!t)return;
 botPush('u',esc(t));
 var et=BOT.etapa;
 if(et==='inicio'){
  if(/senha|e-?mail|entrar|login|esqueci|perdi|recuperar/i.test(t)){botPush('b','Parece que você perdeu a <b>senha</b> da sua conta. Vamos tentar recuperar, não se preocupe! 💪<br>Qual era o <b>nome</b> da sua conta?');}
  else{botPush('b','Entendi. Se for sobre a <b>senha</b> da sua conta, me conta mais um pouco.<br>De qualquer forma: qual era o <b>nome</b> da sua conta?');}
  BOT.etapa='nome';botRender();
 }else if(et==='nome'){botProcessaNome(t);}
 else if(et==='digitos'){botProcessaDigitos(t);}
 else if(et==='nova_senha'){BOT.tmpSenha=t;botPush('b','Agora <b>confirme</b> a nova senha:');BOT.etapa='confirma_senha';botRender();}
 else if(et==='confirma_senha'){
  if(t===BOT.tmpSenha){BOT.alvo.senha=t;contaUpsert(BOT.alvo);botPush('b','Pronto! 🎉 Agora você já pode entrar na sua conta. <b>Tchau!</b> 👋');BOT.etapa='fim';}
  else{botPush('b','As senhas não são iguais. Vamos de novo: digite a <b>nova senha</b>:');BOT.etapa='nova_senha';}
  botRender();
 }
}
function botProcessaNome(t){
 if(/^(n[aã]o|nao|n[ãa]o lembro|nao lembro|esqueci|n sei|sei la)/i.test(t)){botEtapaFoto();return;}
 var acc=contasTodas().find(function(a){return a.nome.toLowerCase()===t.toLowerCase();});
 if(acc){BOT.alvo=acc;botPerguntaDigitos();}
 else{botPush('b','Não achei nenhuma conta com esse nome. 🤔<br>Quer <b>tentar outro nome</b> ou me mandar a <b>foto de perfil</b>?');BOT.etapa='nome';botRender();}
}
function botPerguntaDigitos(){
 var sn=BOT.alvo.senha||'';var dig=sn.replace(/\D/g,'');
 if(dig){botPush('b','Achei a conta <b>'+esc(BOT.alvo.nome)+'</b>! ✅<br>Agora me fala: quais <b>números</b> tinha na sua senha? (só os números que você lembra)');}
 else{botPush('b','Achei a conta <b>'+esc(BOT.alvo.nome)+'</b>! ✅<br>Agora me fala: quais <b>letras</b> tinha na sua senha?');}
 BOT.etapa='digitos';botRender();
}
function botProcessaDigitos(t){
 var sn=BOT.alvo.senha||'';var dig=sn.replace(/\D/g,'');
 var ok=false;
 if(dig){var td=t.replace(/\D/g,'');ok=td.length>0&&td===dig;}
 else{ok=t.toLowerCase().replace(/[^a-z]/g,'')===sn.toLowerCase().replace(/[^a-z]/g,'')&&t.length>0;}
 if(ok){botPush('b','Ok, você colocou certo! ✅<br>Digite a <b>nova senha</b>:');BOT.etapa='nova_senha';}
 else{botPush('b','Não está certo. 😕<br>Vamos tentar a <b>última coisa</b>: qual a <b>última música</b> que você jogou?<br>Ela era da <b>comunidade</b> ou <b>importada</b>?');BOT.etapa='origem_musica';}
 botRender();
}
function botEtapaFoto(){
 botPush('b','Vixi! 😅 Tenta ver se você ainda tem a <b>foto de perfil</b> da conta.<br>Me envia ela aqui que eu verifico qual conta tem essa foto.<br>Se não tiver a foto, não tem como 😔');
 BOT.etapa='foto';botRender();
}
function botReceberFoto(inp){
 var f=inp.files[0];if(!f)return;
 botPush('u','📷 <i>foto enviada</i>');
 BOT.etapa='verificando';botRender();
 setTimeout(function(){
  if(!contasTodas().length){botPush('b','Não achei nenhuma conta salva neste aparelho. 😔<br>Que tal <b>criar uma nova</b>?');BOT.etapa='fim';botRender();return;}
  botPush('b','Encontramos! 👀<br><b>Essa é a sua conta?</b>');
  BOT.etapa='escolha_conta';botRender();
 },1800);
}
function botEscolherConta(btn){
 var nome=btn.getAttribute('data-n');
 var acc=contasTodas().find(function(a){return a.nome===nome;});if(!acc)return;
 botPush('u','É essa! ✅ ('+esc(nome)+')');
 BOT.alvo=acc;botPerguntaDigitos();
}
function botNenhumaConta(){
 botPush('u','Nenhuma dessas');
 botPush('b','Tudo bem, vamos continuar tentando. 🔄<br>Qual era o <b>nome</b> da sua conta? (ou diga "não lembro")');
 BOT.etapa='nome';botRender();
}
function botOrigemMusica(o){BOT.origem=o;botPush('u',o==='comunidade'?'🎵 Comunidade':'📥 Importada');botPush('b','Escolha a música na lista:');BOT.etapa='lista_musicas';botRender();}
function botEtapaLista(){BOT.etapa='lista_musicas';botRender();}
function botEscolherMusica(btn){BOT.musicaEscolhida=btn.getAttribute('data-t');botPush('u','🎵 '+esc(BOT.musicaEscolhida));BOT.etapa='confirma_musica';botRender();}
function botConfirmaMusica1(){BOT.etapa='confirma_musica2';botRender();}
function botConfirmaMusica2(){
 BOT.etapa='verificando';botRender();
 setTimeout(function(){
  var um=BOT.alvo.ultimaMusica;
  if(um&&um.titulo===BOT.musicaEscolhida){botPush('b','É você mesmo! ✅<br>Digite a <b>nova senha</b>:');BOT.etapa='nova_senha';}
  else{botFimFalha();return;}
  botRender();
 },1500);
}
function botFimFalha(){
 botPush('b','Infelizmente não conseguimos provar que é você mesmo.<br>Você pode <b>criar outra conta</b>! 😔');
 BOT.etapa='fim';botRender();
}

function startGame(fase){ if(window._musicaAtual){contaRegistrarMusica(window._musicaAtual.titulo,window._musicaAtual.origem);window._musicaAtual=null;}
 if(fase.fundo==='piano'){setTimeout(()=>{
  const gw=document.getElementById('gameWrap'); if(!gw)return;
  gw.classList.add('pianobg');
  const keys=document.createElement('div'); keys.className='pianokeys';
  const whites=14, blackAfter=[0,1,3,4,5]; let html='';
  for(let w=0;w<whites;w++){
   html+='<div class="wkey" style="left:'+(w/whites*100)+'%;width:'+(100/whites)+'%"></div>';
   if(blackAfter.includes(w%7))html+='<div class="bkey" style="left:calc('+((w+1)/whites*100)+'% - 3.2%)"></div>';
  }
  keys.innerHTML=html; gw.appendChild(keys);
 },50);}

app.innerHTML=`<div class="topbar"><button class="iconbtn" onclick="stopGame();showHome()"><span class="material-icons">close</span></button><h1 style="font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${fase.nome||'Fase'}</h1><span id="vidasHud" style="font-size:15px"></span></div>
<div id="gameWrap"><div id="piano"><div id="combo"></div><div class="hitline"></div></div></div>
<div style="background:var(--surface);padding:10px 16px;display:flex;justify-content:space-between;align-items:center"><span style="font-weight:700;color:var(--primary);font-size:20px">⭐ <span id="pts">0</span></span><span style="font-size:12px;color:var(--text2)">Multi-toque ativo 👆👆</span></div>
<div id="endScreen"><div class="mcard" style="max-width:340px;text-align:center"><span class="material-icons" style="font-size:56px;color:var(--primary)" id="endIcon">emoji_events</span><h2 id="endTitle">Fim!</h2><p style="font-size:28px">⭐ <b id="ptsF">0</b></p><p id="rank"></p></div>
<button class="mbtn" style="max-width:340px" onclick="compartilharFase()"><span class="material-icons">share</span> Compartilhar .stylus</button>
<button class="mbtn outlined" style="max-width:340px" onclick="doPublish()"><span class="material-icons">publish</span> Publicar fase</button>
<button class="mbtn outlined" style="max-width:340px" onclick="document.getElementById('endScreen').style.display='none';startGame(lastFase)"><span class="material-icons">replay</span> De novo</button>
<button class="mbtn outlined" style="max-width:340px" onclick="showHome()"><span class="material-icons">home</span> Início</button></div>`;
window.lastFase=fase;
const piano=document.getElementById('piano');const wrap=document.getElementById('gameWrap');
if(fase.bgURL){if(fase.bgTipo==='video'){const v=document.createElement('video');v.src=fase.bgURL;v.autoplay=true;v.loop=true;v.muted=true;v.playsInline=true;v.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.45;pointer-events:none';piano.appendChild(v);}else{const im=document.createElement('img');im.src=fase.bgURL;im.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.45;pointer-events:none';piano.appendChild(im);}}
let audio=null;if(fase.musicaURL){audio=new Audio(fase.musicaURL);audio.playbackRate=parseFloat(fase.velMus||1);window._audio=audio}
let vidas=fase.vidas||5;const vidasInf=vidas===999;
function drawVidas(){document.getElementById('vidasHud').innerText=vidasInf?'♾️':'❤️'.repeat(Math.min(vidas,5))+(vidas>5?' '+vidas:'')}drawVidas();
let notas=fase.notas||[],tiles=[],pts=0,combo=0,playing=true,startTime=0;
const speed=300*parseFloat(fase.velNotas||1);const hitY=()=>piano.clientHeight-90;
for(let i=0;i<4;i++){const l=document.createElement('div');l.className='lane';l.style.left=(i*25)+'%';piano.appendChild(l)}
notas.forEach(n=>{const el=document.createElement('div');let wPct=25,h=70;
if(n.tamanho==='gigante'){wPct=24;h=n.longa?200:110}else if(n.tamanho==='pequena'){wPct=14;h=n.longa?100:40}else{h=n.longa?150:70}
el.className='tile'+(n.longa?' longa':'')+(n.tamanho==='gigante'?' gigante':'')+(n.tamanho==='pequena'?' pequena':'');
el.style.width=wPct+'%';let lp=n.lane*25+(25-wPct)/2;el.style.left=lp+'%';el.style.height=h+'px';el._t=n.t;el._h=h;el._hit=false;el._wPct=wPct;el._leftPct=lp;piano.appendChild(el);tiles.push(el);});
function explode(x,y,cor){for(let i=0;i<14;i++){const p=document.createElement('div');p.className='particle';p.style.background=cor||['#ffde59','#7aa8ff','#ff4081','#00e5ff','#fff'][Math.floor(Math.random()*5)];p.style.left=x+'px';p.style.top=y+'px';const ang=Math.random()*Math.PI*2,dist=60+Math.random()*90;p.style.setProperty('--dx',Math.cos(ang)*dist+'px');p.style.setProperty('--dy',Math.sin(ang)*dist+'px');p.style.animation='explodir.6s ease-out forwards';piano.appendChild(p);setTimeout(()=>p.remove(),650);}const f=document.createElement('div');f.className='flash';piano.appendChild(f);setTimeout(()=>f.remove(),260);if(navigator.vibrate)navigator.vibrate(12);}
function handleTouches(e){e.preventDefault();if(!playing)return;const rect=piano.getBoundingClientRect();
for(const t of e.changedTouches){const x=t.clientX-rect.left,y=t.clientY-rect.top;let ok=false;
for(const el of tiles){if(el._hit||!el.parentNode)continue;const elL=el._leftPct/100*rect.width,elW=el._wPct/100*rect.width,elT=parseFloat(el.style.top||'-999'),elB=elT+el._h;
if(x>=elL-20&&x<=elL+elW+20&&y>=elB-140&&y<=elB+60){el._hit=true;ok=true;pts+=el.classList.contains('longa')?25:10;combo++;document.getElementById('pts').innerText=pts;document.getElementById('combo').innerText=combo>4?combo+' COMBO 🔥':'';explode(x,y);el.style.background='var(--primary)';setTimeout(()=>el.remove(),80);break;}}
if(!ok&&y>hitY()-120&&y<hitY()+120&&!vidasInf){vidas--;drawVidas();combo=0;document.getElementById('combo').innerText='ERROU!';explode(x,y,'#ff0000');if(vidas<=0){endGame(true);return}setTimeout(()=>{if(playing)document.getElementById('combo').innerText=''},400);}}}
piano.addEventListener('touchstart',handleTouches,{passive:false});
piano.addEventListener('mousedown',e=>{handleTouches({preventDefault:()=>{},changedTouches:[{clientX:e.clientX,clientY:e.clientY}]})});
function loop(now){if(!playing)return;if(!startTime)startTime=now;const t=(now-startTime)/1000,hy=hitY();
for(const el of tiles){if(el._hit||!el.parentNode)continue;const y=hy-el._h-(el._t-t)*speed;el.style.top=y+'px';
if(y>hy+70){el.remove();el._hit=true;combo=0;if(!vidasInf){vidas--;drawVidas();if(vidas<=0){endGame(true);return}}document.getElementById('combo').innerText='MISS 💔';setTimeout(()=>{if(playing)document.getElementById('combo').innerText=''},350);}}
const lastT=notas.length?notas[notas.length-1].t:5;if(t>lastT+3){endGame(false);return}requestAnimationFrame(loop);}
function endGame(perdeu){playing=false;if(audio)audio.pause();document.getElementById('ptsF').innerText=pts;contaSomarPontos(pts);document.getElementById('endTitle').innerText=perdeu?'Sem vidas!':'Fim de jogo!';document.getElementById('endIcon').innerText=perdeu?'heart_broken':'emoji_events';document.getElementById('rank').innerText=(pts>800?'🏆 Incrível!':pts>400?'👏 Muito bom!':pts>100?'👍 Bom!':'💪 Tente de novo!');document.getElementById('endScreen').style.display='flex';}
window.stopGame=()=>{playing=false;if(window._audio)window._audio.pause()};
window.doPublish=()=>{if(!FASES_PUB.find(x=>x.id===fase.id))FASES_PUB.push(fase);alert('✅ Publicado!');stopGame();showJogar();};
document.getElementById('combo').innerText='3...';
setTimeout(()=>document.getElementById('combo').innerText='2...',600);
setTimeout(()=>document.getElementById('combo').innerText='1...',1200);
setTimeout(()=>{document.getElementById('combo').innerText='VAI! 🎹';if(audio)audio.play().catch(()=>{});requestAnimationFrame(loop);setTimeout(()=>{if(playing)document.getElementById('combo').innerText=''},700)},1800);
}
</script>
</body>
</html>
